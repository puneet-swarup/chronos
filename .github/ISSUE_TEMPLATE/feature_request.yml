name: Feature request
description: Suggest a capability, action or workflow trigger
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to automate, and where does Chronos get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should Chronos do? If it is a new action, describe its parameters and required capabilities.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduling and recurrence
        - Workflows and conditions
        - Actions and integrations
        - Natural-language input
        - UI and theming
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: android-limits
    attributes:
      label: Android constraints
      description: Does this need a permission, special access, or a feature Android restricts? See docs/PERMISSIONS.md.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the roadmap and this is not already planned or implemented
          required: true
