name: Release

# Every push to main produces an installable build, so a phone running Chronos
# can update itself without a cable. The version code is the workflow run number,
# which is monotonic, so Android always sees a newer build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish test build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="0.1.${{ github.run_number }}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="0.1.${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/chronos-${VERSION}.apk"
          cd dist
          sha256sum "chronos-${VERSION}.apk" > "chronos-${VERSION}.apk.sha256"
          cat "chronos-${VERSION}.apk.sha256"
          ls -la

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.1.${{ github.run_number }}"
          gh release create "v${VERSION}" \
            "dist/chronos-${VERSION}.apk" \
            "dist/chronos-${VERSION}.apk.sha256" \
            --title "Chronos ${VERSION} (test build)" \
            --notes "Automated test build from \`${{ github.sha }}\`.

          Install it once by any means (cable, or download the APK from this page).
          After that, Chronos offers each new build from Settings and installs it
          with a single system confirmation.

          Signed with the repository test key - see \`keystore/README.md\`." \
            --target "${{ github.sha }}"
